---
services:
  db:
    image: apsanadevops/monolethic:dbimg
    ports:
      - "2222:3306"
    deploy:
      replicas : 1
      resources:
        limits:
          cpus: "0.4"
          memory: 400M
        reservations:
          cpus: "0.3"
          memory: 300M
    networks:
      - appnw
    environment:
      MYSQL_ROOT_PASSWORD: root


  auth_service:
    image: apsanadevops/monolethic:authimg
    ports:
      - "6666:5001"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.2"
          memory: 200M
        reservations:
          cpus: "0.1"
          memory: 100M
    networks:
      - appnw


  book_service:
    image: apsanadevops/monolethic:bookimg
    ports:
      - "3333:5002"
    deploy:
      replicas : 2
      resources:
        limits:
          cpus: "0.2"
          memory: 200M
        reservations:
          cpus: "0.1"
          memory: 100M
    networks:
      - appnw


  borrow_service:
    image: apsanadevops/monolethic:borrowimg
    ports:
      - "4444:5003"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.2"
          memory: 200M
        reservations:
          cpus: "0.1"
          memory: 100M
    networks:
      - appnw

      
  frontend:
    image: apsanadevops/monolethic:frontendimg
    ports:
      - "5555:5000"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.2"
          memory: 200M
       reservations:
          cpus: "0.1"
          memory: 100M
    networks:
      - appnw

networks:
  appnw:
    driver: overlay
...
