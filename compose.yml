#### Next time practicing, include resources also

services:
  devopsdb:
    image: apsanadevops/practice-dockerwebapp:dbimg
    ports:
      - 2222:3306
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.4"
          memory: 400M
        reservations:
          cpus: "0.3"
          memory: 300M
    networks:
      - dbnw
    volumes:
      - vol1:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: devopspassword
      

  appcon:
    image: apsanadevops/practice-dockerwebapp:appimg
    ports:
      - 3333:8080
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.3"
          memory: 300M
        reservations:
          cpus: "0.1"
          memory: 100M
    networks:
      - dbnw
    volumes:
      - vol2:/apsana

networks:
  dbnw:
    driver: overlay
volumes:
  vol1:
  vol2:
