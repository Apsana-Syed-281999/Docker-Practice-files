### first img is local img
### second img is from dockerhub
### third image is locally yet to build

### docker-compose up -d

---
services:
  makeup:
    image: makeup
    container_name: makeup
    ports:
      - "1111:80"
    networks:
      - ntw1
      - ntw2

  jewels:
    image: apsanadevops/beauty:jewels
    container_name: jewels
    ports:
      - "2222:80"
    networks:
      - ntw2
      - ntw1

  new:
    build: .
    container_name: con3
    ports:
      - "3333:80"
    volumes:
      - vol1:/usr/share/nginx/html
    networks:
      - ntw3

volumes:
  vol1:
  vol2:
  vol3:

networks:
  ntw1:
  ntw2:
