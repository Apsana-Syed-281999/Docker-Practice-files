---
services:
  db:
    image: apsanadevops/monolethic:dbimg
    ports:
      - "2222:3306"
    deploy:
      replicas : 2
    networks:
      - appnw


  auth_service:
    image: apsanadevops/monolethic:authimg
    ports:
      - "6666:5001"
    deploy:
      replicas: 2
    networks:
      - appnw


  book_service:
    image: apsanadevops/monolethic:bookimg
    ports:
      - "3333:5002"
    deploy:
      replicas : 2
    networks:
      - appnw


  borrow_service:
    image: apsanadevops/monolethic:borrowimg
    ports:
      - "4444:5003"
    deploy:
      replicas: 2
    networks:
      - appnw

      
  frontend:
    image: apsanadevops/monolethic:frontendimg
    ports:
      - "5555:5000"
    deploy:
      replicas: 2
    networks:
      - appnw

networks:
  appnw:
    driver: overlay
...
